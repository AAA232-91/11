<!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>专属惊喜</title>    <style>        body {            margin: 0;            height: 100vh;            display: flex;            justify-content: center;            align-items: center;            background-color: #f4f4f4;            font-family: "Microsoft YaHei", sans-serif;            position: relative;        }        .main-text {            font-size: 80px;            font-weight: bold;            color: #333;            user-select: none;        }        .secret-btn {            position: absolute;            top: 20px;            right: 20px;            padding: 10px 15px;            background-color: #ff4d4f;            color: white;            border: none;            border-radius: 5px;            cursor: pointer;            font-size: 14px;            transition: background 0.3s;        }        .secret-btn:hover {            background-color: #d9363e;        }    </style></head><body>    <!-- 页面中间的大字 -->    <div class="main-text">丢</div>    <!-- 右上角的按钮 -->    <button class="secret-btn" onclick="showSurprise()">仅给姓贾的人点开</button>    <script>        function showSurprise() {            alert("贾勾阳生日快乐，送你一个甲沟炎！");        }    </script></body></html>
